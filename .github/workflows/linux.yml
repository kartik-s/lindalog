# .github/workflows/test.yml
name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install SBCL
        run: |
          sudo apt-get update
          sudo apt-get install -y sbcl curl

      - name: Cache Quicklisp
        uses: actions/cache@v4
        with:
          path: ~/quicklisp
          key: quicklisp-${{ runner.os }}-${{ hashFiles('lindalog.asd') }}
          restore-keys: quicklisp-${{ runner.os }}-

      - name: Install Quicklisp
        run: |
          if [ ! -f ~/quicklisp/setup.lisp ]; then
            curl -sSLO https://beta.quicklisp.org/quicklisp.lisp
            sbcl --non-interactive \
                 --load quicklisp.lisp \
                 --eval '(quicklisp-quickstart:install)'
          fi

      - name: Run tests
        run: |
          sbcl --noinform --non-interactive \
               --load ~/quicklisp/setup.lisp \
               --eval '(push (uiop:getcwd) asdf:*central-registry*)' \
               --eval '(ql:quickload "lindalog/tests")' \
               --eval '(asdf:test-system "lindalog")'
